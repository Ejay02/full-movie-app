[build]
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/tmdb/*"
  to = "/.netlify/functions/tmdb/:splat"
  status = 200

# SPA fallback — required for Vue Router history mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
