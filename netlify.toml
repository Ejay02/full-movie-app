[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # Firebase web configuration is public by design and shipped to each browser.
  # Keep scanning enabled for private credentials, including both TMDB tokens.
  SECRETS_SCAN_OMIT_KEYS = "VUE_APP_FIREBASE_API_KEY,VUE_APP_FIREBASE_APP_ID,VUE_APP_FIREBASE_AUTH_DOMAIN,VUE_APP_FIREBASE_DATABASE_URL,VUE_APP_FIREBASE_MEASUREMENT_ID,VUE_APP_FIREBASE_MESSAGING_SENDER_ID,VUE_APP_FIREBASE_PROJECT_ID,VUE_APP_FIREBASE_STORAGE_BUCKET"

[[redirects]]
  from = "/api/tmdb/*"
  to = "/.netlify/functions/tmdb/:splat"
  status = 200

# SPA fallback — required for Vue Router history mode
[[redirects]]
  from = "/api/stream"
  to = "/.netlify/functions/stream"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
